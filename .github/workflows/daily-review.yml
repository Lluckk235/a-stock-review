name: A股收盘复盘

on:
  schedule:
    - cron: '30 7 * * 1-5'
  workflow_dispatch:

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch market data
        run: python scripts/fetch_market.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}

      - name: Generate review HTML
        run: python scripts/generate_review.py
        env:
          BARK_KEY: ${{ secrets.BARK_KEY }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

      - name: Generate index page
        run: python scripts/generate_index.py
        env:
          SITE_DIR: outputs/review

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./outputs/review
          publish_branch: gh-pages
          keep_files: true
